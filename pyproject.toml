[project]
name = "mosura"
version = "0.2.0"
description = "task management system"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }

authors = [
    { name = "Kevin James", email = "mosura@thekev.in" },
]

dependencies = [
    "fastapi==0.141.1",
    "httptools==0.8.0",
    "jinja2==3.1.6",
    "jira==3.10.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "requests==2.34.2",
    "sqlalchemy[aiosqlite]==2.0.52",
    # NOTE: sqlalchemy's greenlet requirement is gated on markers that list
    # aarch64 but not arm64, so Apple Silicon misses the transitive install.
    # TODO: Remove once greenlet is reliably installed transitively on arm64.
    "greenlet==3.5.5; platform_machine == 'arm64'",
    "uvicorn==0.52.4",
    "uvloop==0.22.1",
]

[project.urls]
repository = "https://github.com/TheKevJames/mosura"

[dependency-groups]
dev = [
    "flake8-broken-line==1.0.0",
    "flake8-complicated-walrus==2.1.0",
    "flake8-import-restrictions==2.1",
    "flake8-requirements==2.3.0",
    "flake8==7.3.0",
    "niquests==3.21.1",
    "pylint==4.0.8",
    "pytest-asyncio==1.4.0",
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["mosura"]

[tool.pytest]
addopts = ["-Werror"]
asyncio_mode = "auto"

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
