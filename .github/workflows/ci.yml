name: ci

on: [pull_request, push]

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.12.13
          # renovate: datasource=docker depName=python
          python-version: 3.14.7
      - uses: j178/prek-action@v3.0.0
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: 0.5.2
          extra-args: --all-files

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.12.13
          # renovate: datasource=docker depName=python
          python-version: 3.14.7
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    needs: [lint, test]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        if: github.event_name == 'push'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - uses: docker/login-action@v4.6.0
        if: github.event_name == 'push'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASS }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: |
            thekevjames/mosura
            quay.io/thekevjames/mosura
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  readme:
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker://pandoc/core:3.11.0
        with:
          args: -o README.md README.rst
      - name: install docker-pushrm
        env:
          # renovate: datasource=github-releases depName=christian-korneck/docker-pushrm
          PUSHRM_VERSION: v1.9.0
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -Lo ~/.docker/cli-plugins/docker-pushrm \
            "https://github.com/christian-korneck/docker-pushrm/releases/download/${PUSHRM_VERSION}/docker-pushrm_linux_amd64"
          chmod +x ~/.docker/cli-plugins/docker-pushrm
      - uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASS }}
      - run: docker pushrm thekevjames/mosura --file=README.md
      - env:
          APIKEY__QUAY_IO: ${{ secrets.QUAY_APIKEY }}
        run: docker pushrm quay.io/thekevjames/mosura --file=README.md
