<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Mosura | {% block title %}{% endblock %}</title>
    <!-- https://cdnjs.com/libraries/semantic-ui -->
    <link href="{{ url_for('static', path='/semantic-2.5.0.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='/app.css') }}" rel="stylesheet">
    <!-- https://releases.jquery.com/ -->
    <script src="{{ url_for('static', path='/jquery-3.7.1.min.js') }}"></script>
    <script src="{{ url_for('static', path='/semantic-2.5.0.min.js') }}"></script>
    <script>
    async function force_sync(event) {
      event.preventDefault();
      const icon = $('#sync i');
      if (icon.hasClass('loading')) {
        return;
      }

      icon.removeClass('red').addClass('loading');
      try {
        const response = await fetch("/api/v0/sync", {method: "POST"});
        if (response.ok) {
          location.reload();
          return;
        }
        console.error('Unable to sync from Jira', response.status);
      } catch (err) {
        console.error('Unable to sync from Jira', err);
      }
      icon.removeClass('loading').addClass('red');
    }
    </script>
    {% block header %}{% endblock %}
  </head>

  <body>
    <div class="ui fixed inverted menu">
      <div class="ui container">
        <a class="header item" href="/">
          <i class="home icon"></i>
        </a>
        <a class="header item" href="/issues">All Issues</a>
        <a class="header item" href="/mine">My Issues</a>
        <a class="header item" href="/triage">Needs Triage</a>
        <a class="header item" href="/timeline">Timeline</a>
        <a class="header right floated item" href="/docs">
          <i class="book icon"></i>
        </a>
        <a class="header item" href="/settings">
          <i class="cogs icon"></i>
        </a>
        <a class="header item" id="sync" href="#" title="Refresh from Jira" onClick="force_sync(event);">
          <i class="sync icon"></i>
        </a>
      </div>
    </div>

    {% block content %}{% endblock %}
  </body>
</html>
